name: Publish

# Replaces the Travis CI "deploy: provider: pypi" step, which uploaded
# "sdist bdist_wheel" on every tag.
#
# Uploading uses PyPI's trusted publishing (OpenID Connect), so no API token
# needs to be stored as a secret. This requires a one-time setup:
#   1. On PyPI, add a trusted publisher for the "kdtree" project pointing at
#      this repository, the workflow file "publish.yml" and the environment
#      name "pypi".
#   2. In the repository settings, create the "pypi" environment.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kdtree
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
