name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
          - 'pypy3.11'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage hypothesis

      - name: Run tests
        run: coverage run --source=kdtree -m unittest -v

      - name: Show coverage
        run: coverage report

      - name: Convert coverage to lcov
        run: coverage lcov -o coverage.lcov

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov
          flag-name: python-${{ matrix.python-version }}
          parallel: true

  coveralls:
    name: Finish Coveralls
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Close parallel Coveralls build
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  typing:
    name: Type stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build mypy pyright setuptools

      - name: Run typing tests
        run: python -m unittest -v test_typing

      - name: Build wheel
        run: python -m build --wheel

      - name: Check type stubs of the installed wheel
        # Run outside the source tree, so that the installed wheel (and not
        # the files in the checkout) is picked up
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cp typing_sample.py /tmp/typing_sample.py
          cd /tmp
          python -m mypy --strict --python-executable /tmp/wheel-env/bin/python typing_sample.py
          pyright --pythonpath /tmp/wheel-env/bin/python typing_sample.py
